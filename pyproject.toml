[project]
name = "sslabdata"
version = "3.0.0"
description = "Renderer-agnostic academic lab data assembler: BibTeX + YAML → structured data"
requires-python = ">=3.10"
dependencies = [
    "pybtex~=0.26",
    "pylatexenc~=2.11",
    "pyyaml"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "jsonschema>=4"
]

[project.scripts]
sslabdata = "sslabdata.cli:main"

[project.urls]
Homepage = "https://github.com/siddhss5/sslabdata"
Repository = "https://github.com/siddhss5/sslabdata"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sslabdata*"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["sslabdata"]
branch = true

[tool.coverage.report]
fail_under = 97
precision = 2
