[project]
name = "labdata"
version = "2.0.0"
description = "Renderer-agnostic academic lab data assembler: BibTeX + YAML → structured data"
requires-python = ">=3.10"
dependencies = [
    "pybtex~=0.26",
    "pylatexenc~=2.11",
    "pyyaml"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "jsonschema>=4",
    # Renders the site/ Liquid templates in tests/test_site_templates.py.
    "python-liquid>=2"
]

[project.scripts]
labdata = "labdata.cli:main"

[project.urls]
Homepage = "https://github.com/siddhss5/labdata"
Repository = "https://github.com/siddhss5/labdata"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["labdata*"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["labdata"]
branch = true

[tool.coverage.report]
fail_under = 97
precision = 2
