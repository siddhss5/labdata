# Expected diagnostics for each case in tests/corpus/invalid/<dir>/.
# test_invalid_corpus.py runs `sslabdata --config lab.yaml --validate` in that
# folder, and `--format json --output` for `kept`. Checks:
#
#   exit     error: sslabdata exits non-zero with a message (no traceback).
#            ok:    sslabdata exits zero (a warning at most).
#            any:   either, as long as sslabdata does not crash.
#   reports  what is wrong: tokens (a value, a config key) the output must name.
#   locates  where it is: the file, entry key and field, per #26.
#   kept     bib keys that must still be in the exported output.
#   xfail    checks that fail today, mapped to the issue that fixes them.
#
# Checks look for tokens, never for exact English wording.

# --- BibTeX structure ---------------------------------------------------------

# The field token matters as much as the file and the key: the entry whose
# brace never closes also loses its year, and the year diagnostic names the
# same file and key. A row satisfied by that one would be reporting a
# different defect.
structure.unclosed_brace:
  dir: unclosed_brace
  exit: any
  locates: [broken.bib, brace-broken, title]
  kept: [brace-before, brace-after]

structure.duplicate_key_file:
  dir: duplicate_key_same_file
  exit: error
  reports: [BIB-DUPLICATE-KEY]
  locates: [dup.bib, dup-key, citation_key]

structure.duplicate_key_across:
  dir: duplicate_key_across_files
  exit: error
  reports: [BIB-DUPLICATE-KEY]
  locates: [first.bib, second.bib, shared-key, citation_key]

structure.missing_year:
  dir: missing_year
  exit: any
  reports: [BIB-YEAR-MISSING]
  locates: [noyear.bib, no-year, year]
  kept: [no-year]

structure.crossref:
  dir: crossref_entry
  exit: error
  reports: [BIB-CROSSREF-UNSUPPORTED, proc2024]
  locates: [crossref.bib, child2024, crossref]

structure.crossref_undefined_parent:
  dir: crossref_undefined_parent
  exit: error
  reports: [BIB-CROSSREF-UNSUPPORTED, no-such-parent]
  locates: [crossref.bib, orphan-child, crossref]

# The field is rejected on its presence, not on its value, so an empty one
# and a whitespace-only one are the same error as any other.
structure.crossref_no_parent:
  dir: crossref_no_parent
  exit: error
  reports: [BIB-CROSSREF-UNSUPPORTED]
  locates: [crossref.bib, empty-crossref, blank-crossref, crossref]

structure.year_not_number:
  dir: year_not_number
  exit: any
  locates: [badyear.bib, bad-year, year]
  kept: [bad-year, ok-entry]

structure.missing_journal:
  dir: missing_journal
  exit: any
  locates: [nojournal.bib, no-journal, journal]
  kept: [no-journal]

structure.missing_booktitle:
  dir: missing_booktitle
  exit: any
  locates: [nobooktitle.bib, no-booktitle, booktitle]
  kept: [no-booktitle]

strings.undefined:
  dir: undefined_string
  exit: any
  reports: [nosuchmacro]
  locates: [macro.bib, undefined-macro, booktitle]
  kept: [undefined-macro, ok-entry]

types.unsupported:
  dir: unsupported_entry_type
  exit: any
  reports: [unpublished]
  locates: [entry.bib, draft-note, entry_type]
  kept: [draft-note]

latex.unknown_macro:
  dir: unknown_macro
  exit: any
  reports: [fictionalmacro]
  locates: [macro.bib, unknown-macro, title]
  kept: [unknown-macro]

# One line for the command, however many fields use it, with the count and
# the first field in document order.
latex.unknown_macro_repeated:
  dir: unknown_macro_repeated
  exit: any
  reports: [fictionalmacro, 3 fields]
  locates: [macro.bib, first-use, title]
  kept: [first-use, second-use]

# Valid input kept here as a regression case: on its own it must pass with
# no LATEX-COMMAND-UNKNOWN, and the valid corpus stays unchanged.
latex.text_macros:
  dir: common_text_macros
  exit: ok
  kept: [text-macros]

# The first byte that is not UTF-8 is on line 6 of latin1.bib.
structure.not_utf8:
  dir: bib_not_utf8
  exit: error
  reports: [BIB-ENCODING-INVALID, "0xfc"]
  locates: [latin1.bib, line 6]

# --- Projects, people and identity -------------------------------------------

projects.undefined:
  dir: undefined_project
  exit: any
  reports: [nosuchproject]
  locates: [tagged.bib, proj-undefined, project]
  kept: [proj-undefined]

people.duplicate_id:
  dir: duplicate_person_id
  exit: error
  reports: [aadams]
  locates: [people.yaml]

projects.duplicate_id:
  dir: duplicate_project_id
  exit: error
  reports: [homebot]
  locates: [projects.yaml]

# A role is any non-empty string, so what is wrong is the absence of one:
# missing (bbrown), empty (ccote) or not a string (ddavis).
people.invalid_role:
  dir: invalid_person_role
  exit: any
  reports: [PEOPLE-ROLE-INVALID]
  locates: [people.yaml, bbrown, ccote, ddavis, role]

people.invalid_status:
  dir: invalid_person_status
  exit: any
  reports: [retired]
  locates: [people.yaml, bbrown, status]

records.unknown_key:
  dir: record_unknown_key
  exit: ok
  reports: [RECORD-KEY-UNKNOWN, webiste, funding, affiliation]

records.optional_type_invalid:
  dir: record_field_types
  exit: ok
  reports: [RECORD-TYPE-INVALID]

records.required_type_invalid:
  dir: record_id_types
  exit: error
  reports: [PEOPLE-FIELD-MISSING, PROJECTS-FIELD-MISSING, COLLABORATORS-FIELD-MISSING]

projects.invalid_status:
  dir: invalid_project_status
  exit: any
  reports: [sometimes]
  locates: [projects.yaml, sharedarm, status]

people.missing_name:
  dir: people_missing_name
  exit: error
  locates: [people.yaml, bbrown, name]

people.not_a_list:
  dir: people_not_a_list
  exit: error
  locates: [people.yaml]

people.invalid_yaml:
  dir: people_invalid_yaml
  exit: error
  reports: [PEOPLE-YAML-INVALID]
  locates: [people.yaml, line 5]

projects.invalid_yaml:
  dir: projects_invalid_yaml
  exit: error
  reports: [PROJECTS-YAML-INVALID]
  locates: [projects.yaml, line 3]

collaborators.invalid_yaml:
  dir: collaborators_invalid_yaml
  exit: error
  reports: [COLLABORATORS-YAML-INVALID]
  locates: [collaborators.yaml, line 4]

projects.missing_id:
  dir: projects_missing_id
  exit: error
  reports: [PROJECTS-FIELD-MISSING]
  locates: ["projects.yaml::id"]

identity.ambiguous_alias:
  dir: ambiguous_alias
  exit: any
  reports: [bbrown, bbrowning, B. Brown]
  locates: [people.yaml]
  kept: [brown-initial]

