name: Test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.14' ]
    env:
      # Make uv use the matrix interpreter rather than any other on the runner.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        version: "0.12.15"

    - name: Install labdata
      run: |
        uv sync --frozen --extra test

    # The floor matches [tool.coverage.report] fail_under in pyproject.toml.
    - name: Run tests with coverage
      run: |
        uv run --frozen pytest --cov=labdata --cov-branch --cov-report=term-missing --cov-fail-under=97

    - name: Validate demo lab
      run: |
        uv run --frozen labdata --config examples/demo/lab.yaml --validate

    - name: Validate demo lab under --strict
      run: |
        uv run --frozen labdata --config examples/demo/lab.yaml --validate --strict
