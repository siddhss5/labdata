name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        version: "0.12.15"

    - name: Install labdata
      run: |
        uv sync --frozen --extra test

    - name: Generate site data
      run: |
        uv run --frozen labdata --config examples/demo/lab.yaml --output site/_data/lab.yml
        uv run --frozen python scripts/generate_site_config.py examples/demo/lab.yaml site/_config.generated.yml

    - name: Setup Pages
      uses: actions/configure-pages@v6

    # actions/jekyll-build-pages only reads site/_config.yml, so build with
    # Jekyll directly to layer the settings generated from lab.yaml on top.
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        # Installs the gems pinned in site/Gemfile.lock (frozen) and caches them.
        bundler-cache: true
        working-directory: site

    - name: Build Jekyll site
      working-directory: site
      env:
        JEKYLL_ENV: production
        JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        PAGES_REPO_NWO: ${{ github.repository }}
      run: bundle exec jekyll build --config _config.yml,_config.generated.yml --destination ../_site

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
